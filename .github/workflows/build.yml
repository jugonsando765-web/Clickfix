name: Build Click Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: Android32
            os: ubuntu-latest
          - target: Android64
            os: ubuntu-latest
          - target: Win64
            os: windows-latest
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        
        with:
          combine: true
          sdk: nightly
          configure-args: -DGEODE_GD_VERSION=2.2081 -DGEODE_COMP_GD_VERSION=22081
          target: ${{ matrix.config.target }}
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
